name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Get ant URL
        id: ant
        run: |
          base_filename=`wget -qO - https://downloads.apache.org/ant/binaries/ | grep -oE 'href="apache-ant-1.1[0-9].[0-9]+-bin.tar.gz"' | sed 's/"//g' | cut -c6- | sort | tail -1`
          base_dir=`basename ${base_filename} "-bin.tar.gz"`
          echo "base_filename=${base_filename}" >> $GITHUB_OUTPUT
          echo "base_dir=${base_dir}" >> $GITHUB_OUTPUT

      - name: Cache ant
        id: cache-ant
        uses: actions/cache@v4
        with:
          path: ant
          key: ${{ steps.ant.outputs.base_dir }}

      - name: Download ant
        if: steps.cache-ant.outputs.cache-hit != 'true'
        run: |
          wget -q https://www.apache.org/dist/ant/binaries/${{ steps.ant.outputs.base_filename }}
          tar -xf ${{ steps.ant.outputs.base_filename }}
          mv ${{ steps.ant.outputs.base_dir }} ant
          rm -f ${{ steps.ant.outputs.base_filename }}

      - name: Add ant to PATH
        run: echo "${{ github.workspace }}/ant/bin" >> $GITHUB_PATH

      - name: Build, test, and package
        run: ant test dist

      - name: Upload test results on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: build/test-reports
          if-no-files-found: ignore
